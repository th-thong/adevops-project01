---
# Kubernetes configuration for the shared cloud servers.
# Keep existing Vagrant variables unchanged.

kubernetes_minor_version: "v1.37"
kubernetes_pod_network_cidr: "10.244.0.0/16"

kubernetes_control_plane_ip: "172.16.0.4"
kubernetes_cri_socket: "unix:///run/containerd/containerd.sock"

kubernetes_apt_key_url: "https://pkgs.k8s.io/core:/stable:/v1.37/deb/Release.key"
kubernetes_apt_repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.37/deb/ /"

flannel_manifest_url: "https://github.com/flannel-io/flannel/releases/download/v0.28.9/kube-flannel.yml"
flannel_interface: "eth0"

# The assignment specifically uses Helm 3.
helm_version: "v3.22.0"
