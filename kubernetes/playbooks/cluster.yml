---
- name: Prepare Kubernetes nodes
  hosts: k8s
  become: true
  gather_facts: true
  vars_files:
    - ../vars/cloud.yml

  pre_tasks:
    - name: Require explicit approval before changing shared servers
      ansible.builtin.assert:
        that:
          - confirm_shared_server_changes | default(false) | bool
        fail_msg: >-
          Review the planned changes with your group leader.
          Rerun with -e confirm_shared_server_changes=true only after approval.

    - name: Verify the expected operating system and node IP
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Ubuntu"
          - ansible_distribution_version == "24.04"
          - node_ip is defined
        fail_msg: "This playbook expects Ubuntu 24.04 and a node_ip per host."

  tasks:
    - name: Disable active swap
      ansible.builtin.command: swapoff -a
      when: ansible_swaptotal_mb | int > 0

    - name: Disable swap entries in fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#].*\s+swap\s+.*)$'
        replace: '# \1'

    - name: Configure required kernel modules
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter
        owner: root
        group: root
        mode: "0644"

    - name: Load required kernel modules
      ansible.builtin.command: "modprobe {{ item }}"
      loop:
        - overlay
        - br_netfilter
      changed_when: false

    - name: Configure Kubernetes networking sysctl values
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-kubernetes-cri.conf
        content: |
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward = 1
        owner: root
        group: root
        mode: "0644"

    - name: Apply networking sysctl values
      ansible.builtin.sysctl:
        name: "{{ item }}"
        value: "1"
        state: present
        sysctl_file: /etc/sysctl.d/99-kubernetes-cri.conf
        reload: true
      loop:
        - net.bridge.bridge-nf-call-iptables
        - net.bridge.bridge-nf-call-ip6tables
        - net.ipv4.ip_forward

    - name: Install containerd and Kubernetes repository prerequisites
      ansible.builtin.apt:
        name:
          - containerd
          - ca-certificates
          - curl
          - gpg
        state: present
        update_cache: true
        cache_valid_time: 3600
    - name: Ensure containerd configuration directory exists
      ansible.builtin.file:
        path: /etc/containerd
        state: directory
        owner: root
        group: root
        mode: "0755"
    - name: Generate default containerd configuration
      ansible.builtin.shell: containerd config default > /etc/containerd/config.toml
      args:
        creates: /etc/containerd/config.toml

    - name: Configure containerd to use systemd cgroups
      ansible.builtin.lineinfile:
        path: /etc/containerd/config.toml
        regexp: '^\s*#?\s*SystemdCgroup\s*='
        line: '            SystemdCgroup = true'
      notify: Restart containerd

    - name: Ensure containerd is enabled and running
      ansible.builtin.systemd:
        name: containerd
        enabled: true
        state: started

    - name: Create Kubernetes apt key directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Download Kubernetes repository signing key
      ansible.builtin.get_url:
        url: "{{ kubernetes_apt_key_url }}"
        dest: /tmp/kubernetes-release.key
        owner: root
        group: root
        mode: "0644"

    - name: Install Kubernetes repository signing key
      ansible.builtin.command:
        argv:
          - gpg
          - --dearmor
          - --yes
          - --output
          - /etc/apt/keyrings/kubernetes-apt-keyring.gpg
          - /tmp/kubernetes-release.key
      args:
        creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

    - name: Configure Kubernetes apt repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/kubernetes.list
        content: "{{ kubernetes_apt_repo }}\n"
        owner: root
        group: root
        mode: "0644"

    - name: Install kubelet kubeadm and kubectl
      ansible.builtin.apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present
        update_cache: true

    - name: Hold Kubernetes package versions
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl

    - name: Configure kubelet to use the internal node IP
      ansible.builtin.lineinfile:
        path: /etc/default/kubelet
        regexp: '^KUBELET_EXTRA_ARGS='
        line: "KUBELET_EXTRA_ARGS=--node-ip={{ node_ip }}"
        create: true
        owner: root
        group: root
        mode: "0644"

    - name: Enable kubelet
      ansible.builtin.systemd:
        name: kubelet
        enabled: true

  handlers:
    - name: Restart containerd
      ansible.builtin.systemd:
        name: containerd
        state: restarted


- name: Initialize Kubernetes control plane
  hosts: k8s_master
  become: true
  gather_facts: true
  vars_files:
    - ../vars/cloud.yml

  tasks:
    - name: Check whether the control plane already exists
      ansible.builtin.stat:
        path: /etc/kubernetes/admin.conf
      register: admin_config

    - name: Initialize Kubernetes control plane
      ansible.builtin.command: >
        kubeadm init
        --apiserver-advertise-address={{ kubernetes_control_plane_ip }}
        --pod-network-cidr={{ kubernetes_pod_network_cidr }}
        --cri-socket={{ kubernetes_cri_socket }}
      args:
        creates: /etc/kubernetes/admin.conf
      when: not admin_config.stat.exists

    - name: Create kubeconfig directory for azureuser
      ansible.builtin.file:
        path: /home/azureuser/.kube
        state: directory
        owner: azureuser
        group: azureuser
        mode: "0700"

    - name: Copy admin kubeconfig for azureuser
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/azureuser/.kube/config
        remote_src: true
        owner: azureuser
        group: azureuser
        mode: "0600"

    - name: Download the pinned Flannel manifest
      ansible.builtin.get_url:
        url: "{{ flannel_manifest_url }}"
        dest: /tmp/kube-flannel.yml
        owner: root
        group: root
        mode: "0644"

    - name: Configure Flannel to use the internal interface
      ansible.builtin.lineinfile:
        path: /tmp/kube-flannel.yml
        regexp: '^\s*-\s+--iface='
        insertafter: '^\s*-\s+--kube-subnet-mgr$'
        line: "        - --iface={{ flannel_interface }}"

    - name: Apply Flannel CNI manifest
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig=/etc/kubernetes/admin.conf
          - apply
          - -f
          - /tmp/kube-flannel.yml
      register: flannel_apply
      changed_when: >
        'created' in flannel_apply.stdout or
        'configured' in flannel_apply.stdout

    - name: Check whether the worker has joined
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig=/etc/kubernetes/admin.conf
          - get
          - node
          - "{{ hostvars[groups['k8s_nodes'][0]]['ansible_hostname'] }}"
      register: worker_node_check
      changed_when: false
      failed_when: false

    - name: Create a join command when the worker is not registered
      ansible.builtin.command: kubeadm token create --print-join-command
      register: join_command
      changed_when: false
      when: worker_node_check.rc != 0
      no_log: true

    - name: Save the worker join command for the next play
      ansible.builtin.set_fact:
        kubeadm_join_command: >-
          {{ join_command.stdout }}
          --cri-socket={{ kubernetes_cri_socket }}
      when: worker_node_check.rc != 0
      no_log: true

    - name: Download the Helm archive
      ansible.builtin.get_url:
        url: "https://get.helm.sh/helm-{{ helm_version }}-linux-amd64.tar.gz"
        dest: "/tmp/helm-{{ helm_version }}-linux-amd64.tar.gz"
        mode: "0644"

    - name: Extract Helm
      ansible.builtin.unarchive:
        src: "/tmp/helm-{{ helm_version }}-linux-amd64.tar.gz"
        dest: "/tmp"
        remote_src: true
        creates: "/tmp/linux-amd64/helm"

    - name: Install Helm binary
      ansible.builtin.copy:
        src: /tmp/linux-amd64/helm
        dest: /usr/local/bin/helm
        remote_src: true
        owner: root
        group: root
        mode: "0755"


- name: Join the worker to Kubernetes
  hosts: k8s_nodes
  become: true
  gather_facts: true
  vars_files:
    - ../vars/cloud.yml

  tasks:
    - name: Check whether this worker already joined
      ansible.builtin.stat:
        path: /etc/kubernetes/kubelet.conf
      register: worker_kubelet_config

    - name: Join the worker to the control plane
      ansible.builtin.command: >-
        {{ hostvars[groups['k8s_master'][0]]['kubeadm_join_command'] }}
      when:
        - not worker_kubelet_config.stat.exists
        - hostvars[groups['k8s_master'][0]]['kubeadm_join_command'] is defined
      no_log: true


- name: Verify cluster readiness
  hosts: k8s_master
  become: true
  gather_facts: true
  vars_files:
    - ../vars/cloud.yml

  tasks:
    - name: Wait for Kubernetes nodes to become Ready
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig=/etc/kubernetes/admin.conf
          - wait
          - --for=condition=Ready
          - nodes
          - --all
          - --timeout=300s
      changed_when: false

    - name: Display cluster node status
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig=/etc/kubernetes/admin.conf
          - get
          - nodes
          - -o
          - wide
      register: cluster_nodes
      changed_when: false

    - name: Show cluster nodes
      ansible.builtin.debug:
        var: cluster_nodes.stdout_lines

    - name: Display Helm version
      ansible.builtin.command: helm version --short
      register: helm_output
      changed_when: false

    - name: Show Helm version
      ansible.builtin.debug:
        var: helm_output.stdout
